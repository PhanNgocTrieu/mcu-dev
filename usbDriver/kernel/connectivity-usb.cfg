# USB Driver — chọn class driver và host controller có sẵn trong Linux.
# Không thêm driver Android Auto / CarPlay / AirPlay trong kernel.
# Gadget để dạng module: cổng USB-A Host không bị buộc sang device mode.

CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_USB_DWC2=y

CONFIG_USB_STORAGE=m
CONFIG_USB_UAS=m
CONFIG_USB_ACM=m
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_PL2303=m

CONFIG_USB_NET_DRIVERS=m
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_IPHETH=m

CONFIG_USB_HID=y
CONFIG_USB_HIDDEV=y

CONFIG_USB_GADGET=m
CONFIG_USB_LIBCOMPOSITE=m
CONFIG_USB_CONFIGFS=m
CONFIG_USB_CONFIGFS_NCM=y
