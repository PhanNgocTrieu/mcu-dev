services:
  yocto:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: mcu-dev-yocto:scarthgap
    init: true
    stdin_open: true
    tty: true
    volumes:
      - .:/work/mcu-dev:rw
      - ./yocto:/work/yocto:rw
      - ./docker/entrypoint.sh:/opt/yocto/entrypoint.sh:ro
      - ./docker/yocto-init.sh:/opt/yocto/yocto-init.sh:ro
      - ./docker/flash-sd.sh:/opt/yocto/flash-sd.sh:ro
      - ./docker/layers.lock:/opt/yocto/layers.lock:ro
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
