BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

MACHINE ?= "raspberrypi-cm3"
DISTRO ?= "poky"
PACKAGE_CLASSES ?= "package_ipk"

DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

ENABLE_UART = "1"
RPI_USE_U_BOOT = "0"
GPU_MEM = "16"
DISABLE_OVERSCAN = "1"
DISABLE_SPLASH = "1"

# Login on the serial console and over SSH: root / cm3lab and lab / cm3lab.
# lab is allowed to run sudo.
INHERIT += "extrausers"
EXTRA_USERS_PARAMS = " \
    usermod -p '\$6\$DbAcaO2ZJ2jbvgQ0\$fmJ3897Yc0GPcz5lkb6ZlhvEVgy3OamwJMUFWAfnZjW371JSqOPnYjbzhmmJ8f458qXAmHksBbv2WyGD9Vx06.' root; \
    useradd -m -s /bin/sh -p '\$6\$DbAcaO2ZJ2jbvgQ0\$fmJ3897Yc0GPcz5lkb6ZlhvEVgy3OamwJMUFWAfnZjW371JSqOPnYjbzhmmJ8f458qXAmHksBbv2WyGD9Vx06.' lab; \
"

USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

CONF_VERSION = "2"
